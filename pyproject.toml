[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-emotion"
version = "0.1.0"
description = "Clasificacion de emociones con EEG (SEED): ANN vs SNN, 4 vs 62 canales"
authors = [{ name = "Monica Fernandez" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
